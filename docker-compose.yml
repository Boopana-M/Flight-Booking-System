version: "3.9"

# NOTE: This is "Docker basics" (for practice). You can run:
# docker compose up --build

services:
  mongo:
    image: mongo:7
    container_name: fb-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: fb-server
    ports:
      - "5000:5000"
    environment:
      # Use docker mongo service name as host
      MONGO_URI: mongodb://mongo:27017/flight_booking_db
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      # Other secrets should be put using .env in real projects
      JWT_ACCESS_SECRET: change_me
      JWT_REFRESH_SECRET: change_me
      MAIL_HOST: smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USER: change_me
      MAIL_PASS: change_me
      MAIL_FROM: "Flight Booking <no-reply@flightbooking.com>"
      CLOUDINARY_CLOUD_NAME: change_me
      CLOUDINARY_API_KEY: change_me
      CLOUDINARY_API_SECRET: change_me
      RAZORPAY_KEY_ID: change_me
      RAZORPAY_KEY_SECRET: change_me
      RAZORPAY_WEBHOOK_SECRET: change_me
    depends_on:
      - mongo

  client:
    build: ./client
    container_name: fb-client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:

